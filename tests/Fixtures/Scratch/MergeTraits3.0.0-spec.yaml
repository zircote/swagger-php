openapi: 3.0.0
info:
  title: API
  version: '1.0'
paths:
  /api/endpoint:
    get:
      operationId: getMergedAddress
      responses:
        200:
          description: 'successful operation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
components:
  schemas:
    Address:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        street:
          type: string
      required:
        - street
      xml:
        name: Address
