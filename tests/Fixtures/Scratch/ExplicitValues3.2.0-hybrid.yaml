openapi: 3.2.0
info:
  title: ExplicitValues
  version: '1.0'
paths:
  /explicit-values:
    get:
      operationId: ExplicitValuesEndpoint
      responses:
        '200':
          description: 'All good'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplicitValues'
components:
  schemas:
    ExplicitValuesPet:
      properties:
        name:
          type: string
      type: object
    ExplicitValues:
      properties:
        count:
          type: integer
          maximum: 10
          minimum: 5
        kind:
          enum:
            - cat
            - dog
        pet:
          $ref: '#/components/schemas/ExplicitValuesPet'
      type: object
