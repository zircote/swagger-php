openapi: 3.1.0
info:
  title: 'Type aliases'
  version: '1.0'
paths:
  /trip:
    get:
      operationId: getTrip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeAliasesTrip'
components:
  schemas:
    TypeAliasesTrip:
      properties:
        id:
          type: integer
          format: int64
        stops:
          type: integer
        return:
          type: boolean
        distance:
          type: number
          format: float
        fare:
          type: number
          format: decimal
        departure:
          type: string
          format: date
        booked:
          type: string
          format: date-time
      type: object

