openapi: 3.0.0
info:
  title: Spec32
  version: '1.0'
servers:
  -
    url: 'https://api.acme.dev'
    description: Production
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        200:
          description: 'A list of pets'
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  type: string
              examples:
                serialized:
                  summary: 'Both halves of the 3.2 example pair'
                nullData:
                  summary: 'An explicit null is a value, not an omission'
                nullValue:
                  summary: 'The same, for the pre-3.2 value field'
                  value: null
                noValue:
                  summary: 'Nothing set, so nothing emitted'
          links:
            firstPet:
              operationId: getPet
              description: 'An explicit null request body'
              requestBody: null
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
        -
          oauth2:
            - 'read:pets'
  '/pets/{id}':
    get:
      operationId: getPet
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'One pet'
components:
  responses:
    NotFound:
      description: 'The pet does not exist'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'Deprecated, and advertises its authorization server metadata.'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.acme.dev/oauth/token'
          scopes:
            'read:pets': 'Read pets'
    bearerAuth:
      type: http
      description: 'oauth2MetadataUrl is set but applies to oauth2 only, so it is dropped.'
      scheme: bearer
      bearerFormat: JWT
