openapi: 3.1.0
info:
  title: 'Server Variable Enum Class String Scratch'
  version: '1.0'
servers:
  -
    url: '{env}.example.com:{port}'
    variables:
      env:
        enum:
          - prod
          - staging
        default: prod
      port:
        enum:
          - '8080'
          - '443'
        default: '443'
      secure:
        default: 'yes'
paths:
  /api/endpoint:
    get:
      description: 'An endpoint'
      operationId: serverVariableEnumClassString
      responses:
        '200':
          description: OK
