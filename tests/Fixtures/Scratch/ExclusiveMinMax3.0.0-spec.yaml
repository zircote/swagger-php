        exclusiveMin:
          type: integer
          minimum: 20
          exclusiveMinimum: true
          default: 21
        max:
          type: integer
          maximum: 30
          default: 30
        exclusiveMax:
          type: integer
          maximum: 40
          exclusiveMaximum: true
          default: 41
        exclusiveMinMax:
          type: integer
          maximum: 60
          exclusiveMaximum: true
          minimum: 50
          exclusiveMinimum: true
          default: 51
        exclusiveMinMaxNumber:
          type: integer
          exclusiveMaximum: true
          exclusiveMinimum: true
          minimum: 60
          maximum: 70
          default: 61
      type: object
