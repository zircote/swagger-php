name: build

on:
  schedule:
    - cron: "0 13 * * 1"
  push:
    branches:
      - master
      - 5.x
  pull_request:
    branches:
      - master
      - 5.x

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: true
      matrix:
        operating-system: [ ubuntu-latest ]
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        dependencies: [ 'lowest', 'highest' ]

    name: PHP ${{ matrix.php }} on ${{ matrix.operating-system }} with ${{ matrix.dependencies }} dependencies

    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Composer install
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: "${{ matrix.composer-options }}"

      - name: PHPUnit Tests
        run: composer test -- --configuration phpunit.xml.dist --coverage-text

  floor:
    runs-on: ubuntu-latest

    # php-cs-fixer raises symfony/console's floor; a consumer does not install it
    name: PHP 8.2 with the lowest dependencies a consumer can install

    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Remove php-cs-fixer
        run: composer remove --dev friendsofphp/php-cs-fixer --no-update

      - name: Composer install
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: lowest

      - name: PHPUnit Tests
        run: composer test -- --configuration phpunit.xml.dist
